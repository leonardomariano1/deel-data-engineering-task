services:
  transactions-db:
    build:
      context: ./docker/postgres-db
    environment:
      - POSTGRES_USER=finance_db_user
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=finance_db
    volumes:
        - pg-data:/var/lib/postgresql/data
        - "${PWD}/db-scripts/initialize_db_ddl.sql:/docker-entrypoint-initdb.d/initialize_db_ddl.sql"
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "wal_level=logical", "-c", "hot_standby=on"]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  kafka-connect:
    image: debezium/connect:2.4
    depends_on:
      - kafka
      - transactions-db
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"

  debezium-init:
    image: curlimages/curl:latest
    depends_on:
      - kafka-connect
    volumes:
      - "${PWD}/debezium/init-connectors.sh:/init-connectors.sh"
      - "${PWD}/debezium/connectors:/connectors"
    entrypoint: ["/bin/sh", "/init-connectors.sh"]
    restart: "no"

  # ---------------------------------------------------------------------------
  # Analytical platform
  # ---------------------------------------------------------------------------
  analytics-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=analytics
      - POSTGRES_PASSWORD=analytics
      - POSTGRES_DB=analytics
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=32MB",
              "-c", "max_connections=100", "-c", "synchronous_commit=on"]
    volumes:
      - analytics-data:/var/lib/postgresql/data
      - ./analytics-db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 5s
      retries: 20

  spark-master:
    build: ./spark
    image: acme/spark:3.5.1
    pull_policy: build
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "8090:8080"

  spark-worker-1: &worker
    build: ./spark
    image: acme/spark:3.5.1
    pull_policy: build
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=1536m
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "--webui-port", "8081", "spark://spark-master:7077"]
    ports:
      - "8091:8081"

  spark-worker-2:
    <<: *worker
    ports:
      - "8092:8081"

  spark-app:
    build: ./spark
    image: acme/spark:3.5.1
    pull_policy: build
    depends_on:
      analytics-db:
        condition: service_healthy
      spark-master:
        condition: service_started
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started
      kafka:
        condition: service_started
    hostname: spark-app
    environment:
      - KAFKA_BOOTSTRAP=kafka:29092
      - TRIGGER_INTERVAL=5 seconds
      - MAX_OFFSETS_PER_TRIGGER=200000
      - CHECKPOINT_LOCATION=/checkpoints/orders_cdc
      - ANALYTICS_DB_HOST=analytics-db
    command: ["/opt/app/submit.sh"]
    volumes:
      - spark-checkpoints:/checkpoints
    ports:
      - "4040:4040"
    restart: on-failure

  api:
    build: ./api
    depends_on:
      analytics-db:
        condition: service_healthy
    environment:
      - ANALYTICS_DSN=postgresql://analytics:analytics@analytics-db:5432/analytics
      - SOURCE_DSN=postgresql://finance_db_user:1234@transactions-db:5432/finance_db
    ports:
      - "8010:8000"

volumes:
  pg-data:
  analytics-data:
  spark-checkpoints:
